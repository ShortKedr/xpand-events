name: Release

on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"
    - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without the v prefix (for example, 1.0.0-rc.1)
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Verify commit exists in origin/main
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        git fetch --no-tags origin main
        git merge-base --is-ancestor "$GITHUB_SHA" origin/main

    - name: Resolve release version
      id: version
      shell: bash
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
          VERSION="${{ inputs.version }}"
        else
          VERSION="${GITHUB_REF_NAME#v}"
        fi
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "Version must be SemVer." >&2
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Verify NuGet and UPM release metadata
      run: scripts/verify-release-version.sh "${{ steps.version.outputs.version }}"

    - name: Restore dependencies
      run: dotnet restore Xpand-Events.sln

    - name: Build
      run: dotnet build Xpand-Events.sln --no-restore --configuration Release -p:Version=${{ steps.version.outputs.version }}

    - name: Test
      run: dotnet test Xpand.Events.Tests/Xpand.Events.Tests.csproj --no-restore --no-build --configuration Release -p:Version=${{ steps.version.outputs.version }}

    - name: Pack
      run: dotnet pack Xpand-Events.sln --no-restore --no-build --configuration Release -p:Version=${{ steps.version.outputs.version }} -p:PackageVersion=${{ steps.version.outputs.version }} --output artifacts

    - name: Pack UPM artifact
      run: tar -czf "artifacts/com.xpand.events-${{ steps.version.outputs.version }}.tgz" -C unity/com.xpand.events .

    - name: Install pinned CycloneDX generator
      run: dotnet tool install --tool-path .tools CycloneDX --version 6.2.0

    - name: Generate per-package SBOMs
      shell: bash
      run: |
        while IFS='|' read -r package project; do
          ./.tools/dotnet-CycloneDX "$project" \
            --output "artifacts/sbom/$package" \
            --filename "$package.cdx.json" \
            --output-format Json \
            --exclude-dev \
            --set-name "$package" \
            --set-version "${{ steps.version.outputs.version }}" \
            --set-type Library
        done <<'EOF'
        Xpand.Events|Xpand.Events/Xpand.Events.csproj
        Xpand.Events.Core|Xpand.Events.Core/Xpand.Events.Core.csproj
        Xpand.Events.Async|Xpand.Events.Async/Xpand.Events.Async.csproj
        Xpand.Events.Extensions.Microsoft|Xpand.Events.Extensions.Microsoft/Xpand.Events.Extensions.Microsoft.csproj
        Xpand.Events.Testing|Xpand.Events.Testing/Xpand.Events.Testing.csproj
        Xpand.Events.Analyzers|Xpand.Events.Analyzers/Xpand.Events.Analyzers.csproj
        EOF

    - name: Attest package provenance
      uses: actions/attest@v4
      with:
        subject-path: |
          artifacts/*.nupkg
          artifacts/*.snupkg
          artifacts/com.xpand.events-*.tgz

    - name: Attest Xpand.Events SBOM
      uses: actions/attest@v4
      with:
        subject-path: artifacts/Xpand.Events.${{ steps.version.outputs.version }}.nupkg
        sbom-path: artifacts/sbom/Xpand.Events/Xpand.Events.cdx.json

    - name: Attest Xpand.Events.Core SBOM
      uses: actions/attest@v4
      with:
        subject-path: artifacts/Xpand.Events.Core.${{ steps.version.outputs.version }}.nupkg
        sbom-path: artifacts/sbom/Xpand.Events.Core/Xpand.Events.Core.cdx.json

    - name: Attest Xpand.Events.Async SBOM
      uses: actions/attest@v4
      with:
        subject-path: artifacts/Xpand.Events.Async.${{ steps.version.outputs.version }}.nupkg
        sbom-path: artifacts/sbom/Xpand.Events.Async/Xpand.Events.Async.cdx.json

    - name: Attest Xpand.Events.Extensions.Microsoft SBOM
      uses: actions/attest@v4
      with:
        subject-path: artifacts/Xpand.Events.Extensions.Microsoft.${{ steps.version.outputs.version }}.nupkg
        sbom-path: artifacts/sbom/Xpand.Events.Extensions.Microsoft/Xpand.Events.Extensions.Microsoft.cdx.json

    - name: Attest Xpand.Events.Testing SBOM
      uses: actions/attest@v4
      with:
        subject-path: artifacts/Xpand.Events.Testing.${{ steps.version.outputs.version }}.nupkg
        sbom-path: artifacts/sbom/Xpand.Events.Testing/Xpand.Events.Testing.cdx.json

    - name: Attest Xpand.Events.Analyzers SBOM
      uses: actions/attest@v4
      with:
        subject-path: artifacts/Xpand.Events.Analyzers.${{ steps.version.outputs.version }}.nupkg
        sbom-path: artifacts/sbom/Xpand.Events.Analyzers/Xpand.Events.Analyzers.cdx.json

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: release-packages
        path: |
          artifacts/*.nupkg
          artifacts/*.snupkg
          artifacts/com.xpand.events-*.tgz
          artifacts/sbom/**/*.json
        if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: nuget

    steps:
    - name: Download package
      uses: actions/download-artifact@v4
      with:
        name: release-packages
        path: artifacts

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish to NuGet.org
      shell: bash
      run: |
        while IFS= read -r -d '' package; do
          dotnet nuget push "$package" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ secrets.NUGET_API_KEY }}"
        done < <(find artifacts -maxdepth 1 -type f -name '*.nupkg' ! -name '*.snupkg' -print0)

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download release artifacts
      uses: actions/download-artifact@v4
      with:
        name: release-packages
        path: artifacts

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        version="${GITHUB_REF_NAME#v}"
        flags=(--verify-tag --generate-notes --title "Xpand Events $version")
        if [[ "$version" == *-* ]]; then
          flags+=(--prerelease)
        else
          flags+=(--latest)
        fi
        mapfile -d '' files < <(find artifacts -type f -print0)
        gh release create "$GITHUB_REF_NAME" "${files[@]}" "${flags[@]}"
